version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: movie-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Akash@2002
      MYSQL_DATABASE: bms-tests
    ports:
      - "3307:3306"

  app:
    build: .
    container_name: movie-booking-api
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker